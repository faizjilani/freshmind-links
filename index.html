<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fresh Mind | Links</title>
<meta name="description" content="Fresh Mind - fresh fruits & vegetables. Order on WhatsApp, visit our website and follow us.">
<meta name="theme-color" content="#1f6b2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   EDIT YOUR LINKS HERE  (scroll down to the LINKS section in the script)
   ============================================================ */
:root{
  --green:#1f6b2e; --green-2:#2f8f3e; --leaf:#7cc24f;
  --orange:#f28c28; --cream:#fbf8ef; --ink:#1d2a1f; --muted:#5d6b60;
  --card:#ffffff; --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink); background:var(--cream);
  display:flex; justify-content:center; padding:28px 18px 40px;
  position:relative; overflow-x:hidden;
}
html[lang="ar"] body{font-family:"Tajawal",system-ui,sans-serif}

/* soft decorative blobs */
.blob{position:fixed;border-radius:50%;filter:blur(60px);opacity:.45;z-index:0;pointer-events:none}
.b1{width:320px;height:320px;background:var(--leaf);top:-90px;left:-110px}
.b2{width:280px;height:280px;background:var(--orange);bottom:-100px;right:-90px;opacity:.35}
.b3{width:200px;height:200px;background:#ffd84d;top:40%;right:-120px;opacity:.25}

.wrap{position:relative;z-index:1;width:100%;max-width:440px}

.lang{
  position:absolute;top:0;inset-inline-end:0;
  background:#fff;border:1px solid #e3e8df;border-radius:999px;
  padding:7px 14px;font:inherit;font-size:13px;font-weight:600;color:var(--green);
  cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.05)
}
.lang:active{transform:scale(.97)}

header{text-align:center;padding-top:34px}
.logo{
  width:112px;height:112px;margin:0 auto 16px;border-radius:50%;
  background:#fff;display:grid;place-items:center;
  box-shadow:0 10px 30px rgba(31,107,46,.18);border:4px solid #fff;overflow:hidden
}
.logo img{width:100%;height:100%;object-fit:contain}
h1{font-size:28px;font-weight:700;color:var(--green);letter-spacing:-.3px}
.tag{color:var(--muted);font-size:15px;margin-top:6px;line-height:1.5}
.badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.badge{font-size:12px;font-weight:500;background:#eaf4e3;color:var(--green);padding:5px 11px;border-radius:999px}

main{margin-top:26px;display:flex;flex-direction:column;gap:12px}
.btn{
  display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);
  background:var(--card);border-radius:var(--radius);padding:14px 16px;
  box-shadow:0 4px 14px rgba(29,42,31,.06);border:1px solid #eef1ea;
  transition:transform .15s ease, box-shadow .15s ease;
  opacity:0;animation:rise .45s ease forwards
}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(29,42,31,.1)}
.btn:active{transform:scale(.98)}
.ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex-shrink:0}
.ico svg{width:24px;height:24px;fill:#fff}
.txt{flex:1;min-width:0}
.txt b{display:block;font-size:15.5px;font-weight:600}
.txt small{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.arrow{width:18px;height:18px;fill:none;stroke:#b5bfb3;stroke-width:2.2;flex-shrink:0}
html[dir="rtl"] .arrow{transform:scaleX(-1)}

/* primary WhatsApp button */
.btn.primary{background:linear-gradient(135deg,#25b04f,#1f8a3f);color:#fff;border:none;padding:18px 18px}
.btn.primary .ico{background:rgba(255,255,255,.2)}
.btn.primary small{color:rgba(255,255,255,.85)}
.btn.primary .arrow{stroke:rgba(255,255,255,.85)}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

footer{text-align:center;margin-top:30px;font-size:12px;color:var(--muted)}
footer a{color:var(--green);text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<div class="wrap">
  <button class="lang" id="langBtn" type="button">العربية</button>

  <header>
    <!-- LOGO: upload your logo as "logo.png" next to this file. Until then, the leaf icon shows. -->
    <div class="logo">
      <img src="logo.png" alt="Fresh Mind logo" onerror="this.replaceWith(document.getElementById('leafTpl').content.cloneNode(true))">
    </div>
    <h1 data-en="Fresh Mind" data-ar="فريش مايند">Fresh Mind</h1>
    <p class="tag" data-en="Fresh fruits &amp; vegetables, delivered to your door" data-ar="فواكه وخضروات طازجة، توصيل حتى باب بيتك">Fresh fruits &amp; vegetables, delivered to your door</p>
    <div class="badges">
      <span class="badge" data-en="🍎 Farm fresh" data-ar="🍎 طازج من المزرعة">🍎 Farm fresh</span>
      <span class="badge" data-en="🚚 Fast delivery" data-ar="🚚 توصيل سريع">🚚 Fast delivery</span>
      <span class="badge" data-en="🇦🇪 UAE" data-ar="🇦🇪 الإمارات">🇦🇪 UAE</span>
    </div>
  </header>

  <main id="links"></main>

  <footer>
    <span data-en="Thank you for choosing" data-ar="شكراً لاختياركم">Thank you for choosing</span>
    <a href="https://freshmind.ae">Fresh Mind</a> 💚
    <div style="margin-top:6px">© <span id="yr"></span> Fresh Mind</div>
  </footer>
</div>

<template id="leafTpl">
  <svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
    <path d="M52 10C30 10 14 22 14 40c0 5 2 9 4 12 2-10 9-20 22-26-11 8-17 17-19 28 3 2 7 3 11 3 18 0 22-20 20-47z" fill="#2f8f3e"/>
    <circle cx="20" cy="20" r="7" fill="#f28c28"/>
  </svg>
</template>

<script>
/* ============================================================
   LINKS  —  change only the "url" values below.
   - Leave a url as "" (empty) to hide that button.
   - WhatsApp format: https://wa.me/971XXXXXXXXX  (no +, no spaces, no leading 0)
   ============================================================ */
const LINKS = [
  { id:"whatsapp",  url:"https://wa.me/971500000000",          primary:true,
    en:["Order on WhatsApp","Chat with us — fast replies"], ar:["اطلب عبر واتساب","تواصل معنا — رد سريع"], color:"#25b04f" },
  { id:"website",   url:"https://freshmind.ae",
    en:["Visit our website","Browse products & order online"], ar:["زوروا موقعنا","تصفح المنتجات واطلب أونلاين"], color:"#1f6b2e" },
  { id:"instagram", url:"https://instagram.com/YOUR_PAGE",
    en:["Instagram","Daily fresh arrivals"], ar:["إنستغرام","وصول المنتجات الطازجة يومياً"], color:"#d6336c" },
  { id:"facebook",  url:"https://facebook.com/YOUR_PAGE",
    en:["Facebook","Offers & updates"], ar:["فيسبوك","العروض والأخبار"], color:"#1877f2" },
  { id:"tiktok",    url:"https://tiktok.com/@YOUR_PAGE",
    en:["TikTok","Watch our videos"], ar:["تيك توك","شاهد فيديوهاتنا"], color:"#111111" },
  { id:"phone",     url:"tel:+971500000000",
    en:["Call us","Speak to our team"], ar:["اتصل بنا","تحدث مع فريقنا"], color:"#f28c28" },
  { id:"location",  url:"",   /* paste a Google Maps link here to show this button */
    en:["Find us","Open in Google Maps"], ar:["موقعنا","افتح في خرائط جوجل"], color:"#e8483b" },
];

const ICONS = {
  whatsapp:'<path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2s.2-1.1.2-1.2-.2-.2-.4-.3z"/>',
  website:'<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.9 6h-3a15.6 15.6 0 0 0-1.4-3.6A8 8 0 0 1 18.9 8zM12 4c.8 1.2 1.5 2.5 1.9 4h-3.8c.4-1.5 1.1-2.8 1.9-4zM4.3 14a8 8 0 0 1 0-4h3.4a16.5 16.5 0 0 0 0 4H4.3zm.8 2h3a15.6 15.6 0 0 0 1.4 3.6A8 8 0 0 1 5.1 16zm3-8h-3a8 8 0 0 1 4.4-3.6A15.6 15.6 0 0 0 8.1 8zM12 20c-.8-1.2-1.5-2.5-1.9-4h3.8c-.4 1.5-1.1 2.8-1.9 4zm2.3-6H9.7a14.7 14.7 0 0 1 0-4h4.6a14.7 14.7 0 0 1 0 4zm.3 5.6c.6-1.1 1.1-2.3 1.4-3.6h3a8 8 0 0 1-4.4 3.6zm1.7-5.6a16.5 16.5 0 0 0 0-4h3.4a8 8 0 0 1 0 4h-3.4z"/>',
  instagram:'<path d="M12 7.3a4.7 4.7 0 1 0 0 9.4 4.7 4.7 0 0 0 0-9.4zm0 7.7a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm4.9-8.9a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2zM12 4.2c2.5 0 2.8 0 3.8.1 2.6.1 3.8 1.3 3.9 3.9.1 1 .1 1.3.1 3.8s0 2.8-.1 3.8c-.1 2.6-1.3 3.8-3.9 3.9-1 .1-1.3.1-3.8.1s-2.8 0-3.8-.1c-2.6-.1-3.8-1.3-3.9-3.9-.1-1-.1-1.3-.1-3.8s0-2.8.1-3.8C4.4 5.6 5.6 4.4 8.2 4.3c1-.1 1.3-.1 3.8-.1zM12 2.5c-2.6 0-2.9 0-3.9.1-3.5.2-5.4 2.1-5.6 5.6-.1 1-.1 1.3-.1 3.9s0 2.9.1 3.9c.2 3.5 2.1 5.4 5.6 5.6 1 .1 1.3.1 3.9.1s2.9 0 3.9-.1c3.5-.2 5.4-2.1 5.6-5.6.1-1 .1-1.3.1-3.9s0-2.9-.1-3.9c-.2-3.5-2.1-5.4-5.6-5.6-1-.1-1.3-.1-3.9-.1z"/>',
  facebook:'<path d="M14 8.5V6.8c0-.8.2-1.3 1.4-1.3H17V2.6c-.3 0-1.3-.1-2.4-.1-2.4 0-4 1.4-4 4.1v1.9H8v3.2h2.6V22H14V11.7h2.6l.4-3.2h-3z"/>',
  tiktok:'<path d="M16.6 2h-3.3v13.2a2.9 2.9 0 1 1-2.9-2.9c.3 0 .6 0 .9.1V9a6.2 6.2 0 1 0 5.3 6.2V8.4a7.9 7.9 0 0 0 4.4 1.4V6.5A4.5 4.5 0 0 1 16.6 2z"/>',
  phone:'<path d="M20 15.5c-1.2 0-2.4-.2-3.6-.6a1 1 0 0 0-1 .3l-2.2 2.2a15 15 0 0 1-6.6-6.6l2.2-2.2a1 1 0 0 0 .3-1A11.4 11.4 0 0 1 8.5 4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1 17 17 0 0 0 17 17 1 1 0 0 0 1-1v-3.5a1 1 0 0 0-1-1z"/>',
  location:'<path d="M12 2a7 7 0 0 0-7 7c0 5.3 7 13 7 13s7-7.7 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/>'
};
const ARROW = '<svg class="arrow" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';

let lang = (navigator.language||"").startsWith("ar") ? "ar" : "en";
try{ const s = localStorage.getItem("fm_lang"); if(s) lang = s; }catch(e){}

function render(){
  const box = document.getElementById("links");
  box.innerHTML = "";
  LINKS.filter(l => l.url).forEach((l,i) => {
    const [title, sub] = l[lang];
    const a = document.createElement("a");
    a.className = "btn" + (l.primary ? " primary" : "");
    a.href = l.url;
    if(!l.url.startsWith("tel:")){ a.target = "_blank"; a.rel = "noopener"; }
    a.style.animationDelay = (i*0.06)+"s";
    a.innerHTML =
      `<span class="ico" style="${l.primary?"":"background:"+l.color}"><svg viewBox="0 0 24 24">${ICONS[l.id]}</svg></span>
       <span class="txt"><b>${title}</b><small>${sub}</small></span>${ARROW}`;
    box.appendChild(a);
  });
}

function setLang(l){
  lang = l;
  document.documentElement.lang = l;
  document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-en]").forEach(el => el.innerHTML = el.dataset[l]);
  document.getElementById("langBtn").textContent = l === "ar" ? "English" : "العربية";
  try{ localStorage.setItem("fm_lang", l); }catch(e){}
  render();
}

document.getElementById("langBtn").onclick = () => setLang(lang === "ar" ? "en" : "ar");
document.getElementById("yr").textContent = new Date().getFullYear();
setLang(lang);
</script>
</body>
</html>
